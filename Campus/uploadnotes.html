<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Notes - Campus Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
    }

    .container {
      display: flex;
      width: 100%;
    }

    .left, .right {
      flex: 1;
      padding: 30px;
      box-sizing: border-box;
    }

    .left {
      background: #8a8686;
    }

    .right {
      background: #eaeaea;
      overflow-y: auto;
      background-color: ;
    }

    h2 {
      margin-top: 0;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 20px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }

    .note {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
    }

    .note h3 {
      margin: 0;
      font-size: 18px;
    }

    .note img {
      margin-top: 10px;
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 8px;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
</head>
<body>

<div class="container">
  <!-- Left Side: Upload Notes -->
  <div class="left">
    <h2>Upload Notes</h2>
    <input type="text" id="noteTitle" placeholder="Enter Title">
    <input type="file" id="noteFile" accept="image/*">
    <button onclick="uploadNote()">Upload</button>
  </div>

  <!-- Right Side: View Notes -->
  <div class="right">
    <h2>Uploaded Notes</h2>
    <div id="notesList"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>


<script>
 
const notes = [];

function uploadNote() {
  const title = document.getElementById("noteTitle").value;
  const fileInput = document.getElementById("noteFile");
  const file = fileInput.files[0];

  if (!title || !file) {
    alert("Please provide title and select a photo.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function (e) {
    const imageUrl = e.target.result;

    const newNote = {
      title: title,
      imageUrl: imageUrl,
      timestamp: Date.now()
    };

    notes.push(newNote);
    saveNotes();
    displayNotes();

    alert("Note uploaded successfully!");
    document.getElementById("noteTitle").value = "";
    document.getElementById("noteFile").value = "";
  };

  reader.readAsDataURL(file);
}

function saveNotes() {
  localStorage.setItem("notes", JSON.stringify(notes));
}

function loadNotes() {
  const storedNotes = localStorage.getItem("notes");
  if (storedNotes) {
    notes.push(...JSON.parse(storedNotes));
  }
  displayNotes();
}

function displayNotes() {
  const list = document.getElementById("notesList");
  list.innerHTML = "";

  if (notes.length > 0) {
    const sorted = notes.sort((a, b) => b.timestamp - a.timestamp);
    sorted.forEach(note => {
      const div = document.createElement("div");
      div.className = "note";
      div.innerHTML = `<h3>${note.title}</h3><img src="${note.imageUrl}" alt="${note.title}" />`;
      list.appendChild(div);
    });
  } else {
    list.innerHTML = "<p>No notes uploaded yet.</p>";
  }
}

loadNotes();

</script>

</body>
</html>
